# ~/.config/tmux/tmux.conf

# Reload config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ─── Shift+Enter forwarding ───────────────────────────────────────────────────
# Enable extended keys so tmux passes through Shift+Enter CSI-u sequences
# (e.g. \e[13;2u) to the active program instead of collapsing them to Enter.
# Shell-level newline insertion is configured in ~/.inputrc (bash).
#
# 'on' only forwards extended keys when the inner program explicitly requests
# them (xterm modifyOtherKeys / kitty keyboard protocol).  Opencode's Bubble
# Tea TUI doesn't always request them, so we use 'always' to force forwarding.
# 'csi-u' matches the sequence that ~/.inputrc already binds to a newline.
set -s extended-keys always
set -s extended-keys-format csi-u

# Tell tmux that the outer terminal (Kitty, etc.) supports extended keys.
set -as terminal-features ',*:extkeys'

# ─── Mouse support / scrolling ────────────────────────────────────────────────
set -g mouse on

# Scroll with the mouse wheel without pressing prefix first
# (handled automatically when mouse mode is enabled)

# Increase scrollback history
set -g history-limit 50000

# ─── Copy / paste (vi-style) ──────────────────────────────────────────────────
setw -g mode-keys vi

# Use wl-copy for clipboard integration (Wayland)
set -s copy-command "wl-copy"

# Enter copy mode with prefix + [
# Selection keys in copy mode:
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line-and-cancel

# Mouse drag copies to system clipboard and exits copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Paste with prefix + p (or Shift+Insert outside tmux)
bind p paste-buffer

# ─── Misc quality-of-life ─────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"

# ─── Theme ────────────────────────────────────────────────────────────────────
# Colours and the status bar come from the active desktop theme: theme-apply
# renders ~/.config/theme-active/tmux.conf (template: ~/.config/themes/templates/tmux.conf)
# and re-sources it in running servers. -q: stay quiet before the first render.
set -g status-interval 5
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
source-file -q ~/.config/theme-active/tmux.conf
