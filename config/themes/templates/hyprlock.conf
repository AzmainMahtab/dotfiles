# Generated by theme-apply from {{name}}. Do not edit.
auth {
    fingerprint {
        enabled = true
    }
}

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgb({{base.rgb}})
    blur_passes = 0
}

input-field {
    monitor =
    size = 260, 50
    rounding = 0
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb({{accent.rgb}})
    inner_color = rgb({{surface0.rgb}})
    font_color = rgb({{text.rgb}})
    fade_on_empty = false
    placeholder_text = <span foreground="##{{subtext0.hex}}">Password...</span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb({{text.rgb}})
    font_size = 90
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgb({{subtext0.rgb}})
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb({{accent.rgb}})
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 50
    halign = center
    valign = center
}
