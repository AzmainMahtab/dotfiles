# Generated by theme-apply from {{name}}. Do not edit.
set -g @th_base     "{{base}}"
set -g @th_mantle   "{{mantle}}"
set -g @th_crust    "{{crust}}"
set -g @th_surface0 "{{surface0}}"
set -g @th_surface1 "{{surface1}}"
set -g @th_surface2 "{{surface2}}"
set -g @th_overlay0 "{{overlay0}}"
set -g @th_text     "{{text}}"
set -g @th_accent   "{{accent}}"
set -g @th_accent2  "{{accent2}}"
set -g @th_blue     "{{blue}}"
set -g @th_yellow   "{{yellow}}"
set -g @th_pink     "{{pink}}"

set -g status-bg "{{mantle}}"
set -g status-fg "{{text}}"

# Status left: session name
set -g status-left "#[bg=#{@th_blue},fg=#{@th_crust},bold] #S #[bg=#{@th_mantle},fg=#{@th_text}] "

# Window status
set -g window-status-format "#[bg=#{@th_mantle},fg=#{@th_overlay0}] #I:#W "
set -g window-status-current-format "#[bg=#{@th_accent2},fg=#{@th_crust},bold] #I:#W "
set -g window-status-separator ""

# Status right: prefix indicator, time, date
set -g status-right "#{?client_prefix,#[bg=#{@th_yellow}]#[fg=#{@th_crust}] PREFIX ,#[bg=#{@th_surface1}]#[fg=#{@th_text}] NOPREFIX }"
set -ag status-right "#[bg=#{@th_mantle},fg=#{@th_text}] %H:%M #[bg=#{@th_pink},fg=#{@th_crust}] %d-%b-%y "

# Pane borders
set -g pane-border-style fg="#{@th_surface0}"
set -g pane-active-border-style fg="#{@th_accent2}"

# Message / command line
set -g message-style bg="#{@th_surface0}",fg="#{@th_text}"
set -g message-command-style bg="#{@th_surface0}",fg="#{@th_text}"

# Copy mode highlight
set -g mode-style bg="#{@th_surface2}",fg="#{@th_text}"
