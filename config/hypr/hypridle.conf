general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/theme-active/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Idle listeners are disabled on purpose: no auto lock / screen off while idle.
# The general section above still locks the screen before every suspend (lid
# close, power menu) via before_sleep_cmd. Uncomment to lock/blank when idle.
# listener {
#     timeout = 300
#     on-timeout = loginctl lock-session
# }
#
# listener {
#     timeout = 330
#     on-timeout = hyprctl dispatch dpms off
#     on-resume = hyprctl dispatch dpms on
# }
