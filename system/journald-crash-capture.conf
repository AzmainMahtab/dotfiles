[Journal]
# Default SyncIntervalSec is 5m. The 2026-08-28 11:39 full-system lockup lost
# roughly two minutes of buffered kernel log -- including whatever amdgpu
# ring timeout / GPU reset preceded it -- because the machine hard-locked
# before journald ever synced to disk. The journal's last entry was 11:37:37;
# AnyDesk's own trace (which flushes aggressively) ran on to 11:39:35.
#
# 1s means the next lockup leaves evidence behind. Revert by deleting this file
# and running: sudo systemctl restart systemd-journald
SyncIntervalSec=1s
